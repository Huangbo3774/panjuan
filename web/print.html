<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第 4 步 · 打印成 PDF · 磐远试卷打印助手</title>
<link rel="stylesheet" href="css/app.css">
<!-- 服务门闸：本机服务没起来时给一个「启动服务」按钮。
     浏览器不能自己启动本地进程，所以这个按钮走 panjuan:// 协议让 Windows 去拉起服务。-->
<script src="js/gate.js"></script>
<!-- 步骤条顺序只有 js/app.js 那一份定义，页面只声明 data-step -->
<script src="js/app.js"></script>
<script src="js/desktop.js"></script>
</head>
<body data-step="print">
<nav class="nav"><div class="wrap nav__in">
  <a class="logo" href="index.html"><span class="logo__mark">卷</span>
    <span>磐远试卷打印助手<small>第 4 步 · 打印成 PDF</small></span></a>
  <nav class="steps" id="steps" style="margin-left:auto"></nav>
</div></nav>

<main class="wrap">
  <div class="page-head">
    <h1>打印成 PDF</h1>
    <p>左边就是最终 PDF 的真实样子。改右边任何一项，等半秒预览就会自己重排一次；
      下面三个单选决定这张卷子上【有没有孩子的作答、有没有批改结果】。</p>
  </div>

  <div id="head-alert"></div>

  <div class="cols cols--wide-aside">
    <div>
      <div class="stage">
        <img id="big" alt="试卷预览">
        <div class="stage__meta">
          <span class="badge badge--muted" id="note">—</span>
          <span class="badge badge--muted" id="fmeta"></span>
        </div>
      </div>
      <div class="alert alert--info" style="margin-top:16px">
        <span>ℹ</span><span>预览按 110 DPI 出图，只为看版式；下载到的 PDF 是矢量的，
        打印出来比这里清晰。配图（题目里的图形）会原样带到卷子上。</span>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="card__head"><h2>打印内容</h2><span class="spacer"></span>
          <span class="hint" id="mstat">—</span></div>
        <div class="modes" id="modes"></div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card__head"><h2>版式</h2></div>
        <label class="field"><span>试卷标题</span>
          <input type="text" id="o_title" placeholder="留空则用识别到的卷名"></label>
        <label class="field"><span>打印版式<small>A3 对开＝两张 A4 左右 1:1 拼接，标准试卷样式，对折就是 A4 本子</small></span>
          <select id="o_format">
            <option value="a3_spread">A3 横版对开（标准试卷）</option>
            <option value="a4">A4 单页</option>
            <option value="a4_2up">A4 两页一纸（省纸，字缩到 71%）</option>
          </select></label>
        <div class="sect">字号与留白</div>
        <label class="field"><span>字号 <small id="v_font">12pt</small></span>
          <input type="range" id="o_font_size" min="10" max="16" step="0.5"></label>
        <label class="field"><span>整体缩放 <small id="v_scale">100%</small></span>
          <input type="range" id="o_font_scale" min="0.8" max="1.5" step="0.05"></label>
        <label class="field"><span>行距 <small id="v_lead">1.5</small></span>
          <input type="range" id="o_line_spacing" min="1.1" max="2.2" step="0.1"></label>
        <div class="field-grid">
          <label class="field"><span>上边距 mm</span><input type="number" id="o_mt" min="10" max="40"></label>
          <label class="field"><span>左右边距 mm</span><input type="number" id="o_ml" min="10" max="40"></label>
        </div>
        <div class="sect">省纸省墨</div>
        <label class="field field--inline"><span>显示班级 / 姓名 / 得分栏</span>
          <input type="checkbox" id="o_show_header"></label>
        <label class="field field--inline"><span>省墨模式（白底黑字）</span>
          <input type="checkbox" id="o_ink"></label>
        <label class="field field--inline"><span>页脚留出处署名</span>
          <input type="checkbox" id="o_branding"></label>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="btn-row">
          <button class="btn btn--block" id="dl" disabled>下载这份 PDF</button>
        </div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn btn--ghost btn--block" id="toprint" disabled>在浏览器里打开并打印</button>
        </div>
        <div class="btn-row" style="margin-top:8px">
          <button class="btn btn--ghost btn--sm btn--block" id="redo">重排一次（预览看着不对时点这个）</button>
        </div>
        <pre class="log" id="log" style="margin-top:14px"></pre>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>页面缩略</h2>
        <div class="thumbs" id="thumbs"></div>
      </div>
    </div>
  </div>
</main>

<script>
const $=s=>document.querySelector(s);
const MM=72/25.4;
const q=new URLSearchParams(location.search);
const ID=q.get('paper')||q.get('task')||'';
let mode=q.get('mode')||'blank';        // blank | answered | graded
let info=null, opt={}, pages=[], busy=false, timer=null, seq=0;

function alertTo(kind,html){
  const box=$('#head-alert'); box.innerHTML='';
  const d=document.createElement('div'); d.className='alert alert--'+kind;
  d.style.marginBottom='20px';
  d.innerHTML='<span>'+(kind==='ok'?'✓':kind==='warn'?'!':'i')+'</span><span></span>';
  d.lastChild.textContent=html;
  box.appendChild(d);
}

/* ── 内容三态：不可选的也要显示，并把"为什么"写在里面 ───────── */
const MODES=[
  {k:'blank',   t:'空白卷',            d:'直接打印给孩子做，纸上没有任何作答。'},
  {k:'answered',t:'我的答案',           d:'卷子上带上孩子在做题页写的答案，不判对错。'},
  {k:'graded',  t:'我的答案 + 自动批改', d:'在上一项基础上加 ✓/✗/△ 与得分，可以直接发给老师。'}
];
function renderModes(){
  const box=$('#modes'); box.innerHTML='';
  MODES.forEach(m=>{
    const can=m.k==='blank'?info.can_blank:m.k==='answered'?info.can_answered:info.can_graded;
    const lab=document.createElement('label');
    lab.className='mode'+(m.k===mode?' on':'')+(can?'':' off');
    const r=document.createElement('input');
    r.type='radio'; r.name='content'; r.value=m.k; r.checked=m.k===mode;
    r.disabled=!can;
    const tx=document.createElement('span'); tx.className='txt';
    const b=document.createElement('b'); b.textContent=m.t;
    const s=document.createElement('small');
    s.textContent=can?m.d:('暂时不能选 · '+(info.reasons[m.k]||''));
    tx.appendChild(b); tx.appendChild(s);
    lab.appendChild(r); lab.appendChild(tx);
    lab.onclick=e=>{
      if(!can){ e.preventDefault(); return; }
      if(m.k!==mode){ mode=m.k; renderModes(); load(); }
    };
    box.appendChild(lab);
  });
}

/* ── 版式选项 ─────────────────────────────────────────────── */
function fillOptions(o){
  opt=o||{};
  $('#o_title').value=opt.title||'';
  $('#o_format').value=opt.page_format||(opt.two_up?'a4_2up':'a4');
  $('#o_font_size').value=opt.font_size; $('#v_font').textContent=opt.font_size+'pt';
  $('#o_font_scale').value=opt.font_scale; $('#v_scale').textContent=Math.round(opt.font_scale*100)+'%';
  $('#o_line_spacing').value=opt.line_spacing; $('#v_lead').textContent=opt.line_spacing;
  $('#o_mt').value=Math.round(opt.margin_top/MM); $('#o_ml').value=Math.round(opt.margin_left/MM);
  $('#o_show_header').checked=!!opt.show_header;
  $('#o_ink').checked=!!opt.ink_saver;
  $('#o_branding').checked=opt.branding!==false;
}
function collect(){
  const num=id=>parseFloat($(id).value);
  return {
    title:$('#o_title').value.trim(),
    page_format:$('#o_format').value,
    two_up:$('#o_format').value==='a4_2up',
    font_size:num('#o_font_size'), font_scale:num('#o_font_scale'),
    line_spacing:num('#o_line_spacing'),
    margin_top:num('#o_mt')*MM, margin_bottom:num('#o_mt')*MM,
    margin_left:num('#o_ml')*MM, margin_right:num('#o_ml')*MM,
    show_header:$('#o_show_header').checked,
    ink_saver:$('#o_ink').checked,
    branding:$('#o_branding').checked
  };
}

/* ── 预览：URL 由后端带上内容哈希，所以图一定跟着变 ─────────── */
function showPages(list){
  pages=list||[];
  const box=$('#thumbs'); box.innerHTML='';
  if(!pages.length){
    $('#big').removeAttribute('src'); $('#note').textContent='—';
    return;
  }
  pages.forEach((p,i)=>{
    const b=document.createElement('button');
    const im=document.createElement('img');
    im.src=p.image_url.replace(/^\//,'');     // 相对路径：file:// 下绝对路径会去磁盘根
    im.loading='lazy'; im.alt='第'+p.page_no+'页';
    b.appendChild(im);
    b.onclick=()=>{ pick(i); };
    box.appendChild(b);
  });
  pick(0);
}
function pick(i){
  const p=pages[i]; if(!p) return;
  $('#big').src=p.image_url.replace(/^\//,'');
  $('#note').textContent='第 '+p.page_no+' / '+pages.length+' 页';
  [...$('#thumbs').children].forEach((x,k)=>x.classList.toggle('sel',k===i));
}
function logLine(t){
  const el=$('#log');
  el.textContent=(el.textContent.split('\n').slice(-5).join('\n')+'\n['+t+']').replace(/^\n/,'');
}

async function load(){
  const my=++seq;                         // 只认最后一次请求的结果，防止乱序覆盖
  busy=true; $('#mstat').textContent='重排中…';
  const t0=Date.now();
  let r;
  try{
    r=await fetch('api/papers/'+ID+'/preview?mode='+mode+'&_='+Math.random(),{cache:'no-store'});
  }catch(e){ $('#mstat').textContent='取预览失败：'+e.message; busy=false; return; }
  if(my!==seq){ busy=false; return; }
  if(!r.ok){
    const j=await r.json().catch(()=>({}));
    $('#mstat').textContent='出不了这一版';
    $('#note').textContent=j.detail||('HTTP '+r.status);
    showPages([]); $('#dl').disabled=true; $('#toprint').disabled=true;
    busy=false; return;
  }
  const j=await r.json();
  if(my!==seq){ busy=false; return; }
  fillOptions(j.options);
  showPages(j.pages);
  const ms=Date.now()-t0;
  $('#mstat').textContent='已重排 · '+(ms/1000).toFixed(1)+' 秒';
  $('#fmeta').textContent=j.pdf_pages+' 页 · '+(j.pdf_bytes/1024).toFixed(0)+'KB · '+(j.mode||'');
  $('#dl').disabled=false; $('#toprint').disabled=false;
  if(j.note) logLine(j.note);
  logLine('重排 '+j.mode+' rev='+j.revision+' '+ms+'ms');
  busy=false;
}
let dirty=false;
async function saveAndReload(){
  const my=++seq;
  $('#mstat').textContent='保存版式并重排…';
  try{
    const r=await fetch('api/papers/'+ID+'/options',{method:'PUT',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(collect())});
    if(!r.ok){ logLine('选项没保存：HTTP '+r.status); }
  }catch(e){ logLine('选项没保存：'+e.message); }
  if(my!==seq) return;
  load();
}
// 改了任何版式选项：450ms 内没有下一次改动就自动存 + 重排（不用点按钮）
function schedule(){
  dirty=true;
  if(timer) clearTimeout(timer);
  timer=setTimeout(()=>{ timer=null; dirty=false; saveAndReload(); },450);
}

['o_format','o_show_header','o_ink','o_branding'].forEach(id=>$('#'+id).addEventListener('change',schedule));
['o_title','o_mt','o_ml'].forEach(id=>$('#'+id).addEventListener('change',schedule));
['o_font_size','o_font_scale','o_line_spacing'].forEach(id=>$('#'+id).addEventListener('input',()=>{
  $('#v_font').textContent=$('#o_font_size').value+'pt';
  $('#v_scale').textContent=Math.round($('#o_font_scale').value*100)+'%';
  $('#v_lead').textContent=$('#o_line_spacing').value;
  schedule();
}));
$('#redo').onclick=()=>{ seq++; load(); };
$('#dl').onclick=()=>{ location.href='api/papers/'+ID+'/export?mode='+mode; };
$('#toprint').onclick=()=>{ window.open('api/papers/'+ID+'/export?mode='+mode,'_blank'); };

(async function boot(){
  if(!ID){ alertTo('warn','还没上传过材料，这一页没有卷子可打。请先回首页传文件。'); $('#mstat').textContent='缺少试卷参数'; return; }
  let r;
  try{ r=await fetch('api/papers/'+ID+'/printable',{cache:'no-store'}); }
  catch(e){ alertTo('err','读不到这份试卷：'+e.message); return; }
  if(!r.ok){ alertTo('err','读不到这份试卷：'+((await r.json().catch(()=>({}))).detail||('HTTP '+r.status))); return; }
  info=await r.json();
  if(!info.can_blank && !info.questions){ alertTo('warn','这份卷子还没有题目：先去第 2 步识别并校对。'); }
  else if(!info.published){ alertTo('warn','这份卷子【还没发布】（第 2 步没点发布）。空白卷照样能打，'
    +'但在线做题要发布之后才进得去。'); }
  if(mode!=='blank' && !(mode==='answered'?info.can_answered:info.can_graded)){
    logLine('「'+mode+'」当前不可用，已自动切回空白卷'); mode='blank';
  }
  renderModes();
  load();
})();
</script>
</body>
</html>
